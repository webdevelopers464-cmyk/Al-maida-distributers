<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AL-MAIDA DISTRIBUTORS | Management System</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --teal-900:#0A323E; --teal-800:#0D3B4C; --teal-700:#124A5C; --teal-600:#16697A;
  --mint-500:#2A9D8F; --mint-600:#238577; --mint-100:#DCF1EE;
  --amber-500:#E9A23B; --amber-100:#FBEBD3; --amber-700:#8A5A15;
  --red-500:#C1443C; --red-100:#F8DEDC; --red-700:#8A2A24;
  --bg:#F5F3EE; --surface:#FFFFFF; --border:#E3DFD5;
  --text:#1E2A2D; --text-muted:#647274; --text-soft:#8A9598;
  --font-d:'Manrope',sans-serif; --font-b:'Inter',sans-serif; --font-m:'IBM Plex Mono',monospace;
  --radius:10px; --shadow:0 2px 10px rgba(10,50,62,.06), 0 1px 2px rgba(10,50,62,.08);
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:var(--font-b); background:var(--bg); color:var(--text); font-size:14px; line-height:1.5;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; font-size:14px;}
a{color:inherit;}
::selection{background:var(--mint-100);}

/* Layout */
.app{display:flex; min-height:100vh;}
.sidebar{
  width:236px; background:linear-gradient(180deg,var(--teal-900),var(--teal-800) 60%,var(--teal-700));
  color:#fff; display:flex; flex-direction:column; position:fixed; top:0; left:0; bottom:0; z-index:40;
  transition:transform .25s ease;
}
.sidebar-brand{padding:22px 20px 16px; border-bottom:1px solid rgba(255,255,255,.1);}
.sidebar-brand .stamp{
  width:44px; height:44px; border-radius:50%; border:2px dashed rgba(255,255,255,.55);
  display:flex; align-items:center; justify-content:center; font-family:var(--font-d); font-weight:800;
  font-size:15px; letter-spacing:.5px; margin-bottom:10px; color:#fff;
}
.sidebar-brand h1{font-family:var(--font-d); font-size:15.5px; font-weight:800; letter-spacing:.3px; line-height:1.3;}
.sidebar-brand p{font-size:10.5px; color:rgba(255,255,255,.55); margin-top:4px; font-family:var(--font-m); letter-spacing:.3px;}
.nav{flex:1; padding:14px 10px; overflow-y:auto;}
.nav-item{
  display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:8px; color:rgba(255,255,255,.75);
  font-size:13.5px; font-weight:600; cursor:pointer; margin-bottom:2px; transition:.15s; border:none; background:none; width:100%; text-align:left;
}
.nav-item i{width:18px; text-align:center; font-size:14px;}
.nav-item:hover{background:rgba(255,255,255,.08); color:#fff;}
.nav-item.active{background:var(--mint-500); color:#fff; box-shadow:0 2px 8px rgba(42,157,143,.4);}
.nav-section-label{font-size:10px; text-transform:uppercase; letter-spacing:1px; color:rgba(255,255,255,.35); padding:14px 12px 6px; font-weight:700;}
.sidebar-footer{padding:14px 18px; border-top:1px solid rgba(255,255,255,.1); font-size:10px; color:rgba(255,255,255,.4); font-family:var(--font-m);}

.main{margin-left:236px; flex:1; min-height:100vh; display:flex; flex-direction:column; width:calc(100% - 236px);}
.topbar{
  background:var(--surface); border-bottom:1px solid var(--border); padding:14px 26px; display:flex; align-items:center;
  justify-content:space-between; position:sticky; top:0; z-index:20;
}
.topbar h2{font-family:var(--font-d); font-size:19px; font-weight:800; color:var(--teal-900);}
.topbar .sub{font-size:12px; color:var(--text-muted); margin-top:2px;}
.menu-toggle{display:none; background:none; border:none; font-size:20px; color:var(--teal-900);}
.content{padding:24px 26px 60px; flex:1;}

/* Cards / stats */
.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin-bottom:24px;}
.stat-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow); position:relative; overflow:hidden;}
.stat-card .icon{width:38px; height:38px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:15px; margin-bottom:12px;}
.stat-card .val{font-family:var(--font-d); font-size:26px; font-weight:800; color:var(--teal-900);}
.stat-card .lbl{font-size:12px; color:var(--text-muted); margin-top:3px; font-weight:600;}
.stat-card.warn .icon{background:var(--amber-100); color:var(--amber-700);}
.stat-card.mint .icon{background:var(--mint-100); color:var(--mint-600);}
.stat-card.teal .icon{background:#E4EFF1; color:var(--teal-700);}
.stat-card.red .icon{background:var(--red-100); color:var(--red-700);}

.panel{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:20px;}
.panel-head{padding:16px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;}
.panel-head h3{font-family:var(--font-d); font-size:15px; font-weight:800; color:var(--teal-900);}
.panel-body{padding:18px 20px;}

.quick-actions{display:flex; flex-wrap:wrap; gap:10px;}
.qa-btn{display:flex; align-items:center; gap:8px; padding:11px 16px; border-radius:8px; background:var(--teal-900); color:#fff; border:none; font-weight:700; font-size:13px;}
.qa-btn:hover{background:var(--teal-700);}
.qa-btn.mint{background:var(--mint-500);}
.qa-btn.mint:hover{background:var(--mint-600);}
.qa-btn.outline{background:var(--surface); color:var(--teal-900); border:1.5px solid var(--border);}

/* Buttons */
.btn{display:inline-flex; align-items:center; gap:7px; padding:9px 15px; border-radius:8px; border:none; font-weight:700; font-size:13px; transition:.15s;}
.btn-primary{background:var(--mint-500); color:#fff;}
.btn-primary:hover{background:var(--mint-600);}
.btn-secondary{background:var(--teal-900); color:#fff;}
.btn-secondary:hover{background:var(--teal-700);}
.btn-outline{background:var(--surface); color:var(--text); border:1.5px solid var(--border);}
.btn-outline:hover{border-color:var(--mint-500); color:var(--mint-600);}
.btn-danger{background:var(--red-100); color:var(--red-700);}
.btn-danger:hover{background:var(--red-500); color:#fff;}
.btn-sm{padding:6px 11px; font-size:12px;}
.icon-btn{background:none; border:none; color:var(--text-muted); font-size:14px; padding:6px 8px; border-radius:6px;}
.icon-btn:hover{background:var(--bg); color:var(--teal-800);}

/* Forms */
.form-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:14px;}
.field label{display:block; font-size:12px; font-weight:700; color:var(--text-muted); margin-bottom:5px; letter-spacing:.2px;}
.field input,.field select,.field textarea{
  width:100%; padding:9px 11px; border:1.5px solid var(--border); border-radius:7px; background:var(--bg); color:var(--text); transition:.15s;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none; border-color:var(--mint-500); background:#fff;}
.search-bar{display:flex; align-items:center; gap:8px; background:var(--bg); border:1.5px solid var(--border); border-radius:8px; padding:8px 12px; max-width:280px;}
.search-bar input{border:none; background:none; flex:1; outline:none;}
.search-bar i{color:var(--text-soft);}

/* Table */
.table-wrap{overflow-x:auto; border-radius:8px; border:1px solid var(--border);}
table{width:100%; border-collapse:collapse; min-width:600px;}
thead th{background:var(--bg); text-align:left; padding:11px 12px; font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--text-muted); font-weight:700; border-bottom:1.5px solid var(--border); white-space:nowrap;}
tbody td{padding:11px 12px; border-bottom:1px solid var(--border); font-size:13.5px; vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#FAFAF7;}
.mono{font-family:var(--font-m); font-weight:600;}
.empty-row td{text-align:center; padding:38px 20px; color:var(--text-soft);}

/* Badges (stamp style) */
.badge{display:inline-flex; align-items:center; gap:5px; padding:4px 10px 4px 8px; border-radius:20px; font-size:11px; font-weight:700; border:1.5px dashed currentColor;}
.badge.low{background:var(--red-100); color:var(--red-700);}
.badge.ok{background:var(--mint-100); color:var(--mint-600);}
.badge.pending{background:var(--amber-100); color:var(--amber-700);}
.badge.approved{background:#E4EFF1; color:var(--teal-700);}
.badge.dispatched{background:#E8E4F8; color:#5B3FA0;}
.badge.delivered{background:var(--mint-100); color:var(--mint-600);}

/* Modal */
.modal-overlay{position:fixed; inset:0; background:rgba(10,50,62,.5); display:none; align-items:flex-start; justify-content:center; z-index:100; padding:40px 16px; overflow-y:auto;}
.modal-overlay.show{display:flex;}
.modal{background:#fff; border-radius:12px; width:100%; max-width:560px; box-shadow:0 20px 60px rgba(0,0,0,.25); animation:modalIn .18s ease;}
.modal.wide{max-width:900px;}
@keyframes modalIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
.modal-head{padding:18px 22px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between;}
.modal-head h3{font-family:var(--font-d); font-weight:800; font-size:16px; color:var(--teal-900);}
.modal-body{padding:20px 22px; max-height:70vh; overflow-y:auto;}
.modal-foot{padding:16px 22px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px;}

/* Toast */
.toast-wrap{position:fixed; top:18px; right:18px; z-index:200; display:flex; flex-direction:column; gap:10px;}
.toast{background:var(--teal-900); color:#fff; padding:12px 18px; border-radius:8px; font-size:13px; font-weight:600; box-shadow:0 8px 24px rgba(0,0,0,.2); display:flex; align-items:center; gap:10px; animation:toastIn .2s ease; min-width:220px;}
.toast.success{background:var(--mint-600);}
.toast.error{background:var(--red-500);}
.toast.warn{background:var(--amber-500); color:#3a2705;}
@keyframes toastIn{from{opacity:0; transform:translateX(30px);} to{opacity:1; transform:translateX(0);}}

/* Invoice builder */
.inv-items thead th{font-size:10px;}
.inv-items input{width:100%; padding:6px 7px; font-size:12.5px; border:1.5px solid var(--border); border-radius:5px; background:#fff;}
.inv-items select{width:100%; padding:6px 5px; font-size:12.5px; border:1.5px solid var(--border); border-radius:5px; background:#fff;}
.totals-box{background:var(--bg); border-radius:8px; padding:16px 18px; margin-top:14px; max-width:360px; margin-left:auto;}
.totals-box .row{display:flex; justify-content:space-between; padding:5px 0; font-size:13px; color:var(--text-muted);}
.totals-box .row.grand{font-weight:800; font-size:16px; color:var(--teal-900); border-top:1.5px dashed var(--border); margin-top:6px; padding-top:10px;}
.words-box{margin-top:10px; font-style:italic; font-size:12.5px; color:var(--text-muted); background:var(--mint-100); padding:8px 12px; border-radius:6px;}

/* Empty state */
.empty-state{text-align:center; padding:50px 20px; color:var(--text-soft);}
.empty-state i{font-size:34px; margin-bottom:12px; opacity:.5;}
.empty-state p{font-size:13.5px;}

/* Tabs */
.tabs{display:flex; gap:4px; border-bottom:1.5px solid var(--border); margin-bottom:18px;}
.tab-btn{padding:10px 16px; background:none; border:none; font-weight:700; font-size:13px; color:var(--text-muted); border-bottom:2.5px solid transparent; margin-bottom:-1.5px;}
.tab-btn.active{color:var(--mint-600); border-color:var(--mint-500);}

/* Booker login */
.login-screen{max-width:380px; margin:60px auto; background:#fff; border-radius:14px; box-shadow:var(--shadow); padding:32px 28px; border:1px solid var(--border);}
.login-screen .stamp{width:56px; height:56px; border-radius:50%; border:2px dashed var(--mint-500); display:flex; align-items:center; justify-content:center; margin:0 auto 16px; color:var(--mint-600); font-family:var(--font-d); font-weight:800;}
.login-screen h3{text-align:center; font-family:var(--font-d); font-weight:800; color:var(--teal-900); margin-bottom:4px;}
.login-screen p.sub{text-align:center; color:var(--text-muted); font-size:12.5px; margin-bottom:20px;}

.gps-chip{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-family:var(--font-m); background:var(--mint-100); color:var(--mint-600); padding:5px 10px; border-radius:20px; margin-top:6px;}

footer.credit{text-align:center; padding:20px; font-size:11px; color:var(--text-soft); font-family:var(--font-m);}

/* Print styles */
.print-only{display:none;}
@media print{
  @page{ size:A4; margin:10mm; }
  body{margin:0;}
  .app, .modal-overlay, .toast-wrap{display:none !important;}
  .print-only{display:block !important; position:static; width:100%; padding:0; margin:0;}
  .page-break{page-break-before:always;}
  .form2a-box, .inv-print-table, .inv-print-head{page-break-inside:avoid;}
  #printInvoiceArea{display:flex; flex-direction:column; min-height:277mm;}
  #printInvoiceArea .form2a-box{margin-top:auto; margin-bottom:0;}
}
.inv-print-head{display:flex; justify-content:space-between; align-items:flex-start; border-bottom:2px solid #0D3B4C; padding-bottom:6px; margin-bottom:8px;}
.inv-print-head h1{font-family:var(--font-d); font-size:16px; color:#0D3B4C; font-weight:800;}
.inv-print-head p{font-size:9px; color:#444; margin-top:1px;}
.inv-print-head .meta{text-align:right; font-size:9.5px;}
.inv-print-table{width:100%; border-collapse:collapse; margin:6px 0; font-size:9px;}
.inv-print-table th,.inv-print-table td{border:1px solid #999; padding:2px 5px; text-align:left;}
.inv-print-table th{background:#eee;}
.form2a-box{border:1.5px solid #0D3B4C; padding:8px 10px; margin-top:8px;}
.form2a-box h2{text-align:center; font-family:var(--font-d); color:#0D3B4C; margin-bottom:6px; font-size:12px;}
#printInvoiceArea{font-size:11px;}
#printInvoiceArea p{margin:1px 0;}

@media (max-width:900px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0; width:100%;}
  .menu-toggle{display:block;}
  .content{padding:18px 14px 50px;}
  .modal{max-width:94vw;}
}
</style>
</head>

<script>
/* ============ STORAGE ============ */
const DB = {
  products:'amd_products', customers:'amd_customers', purchases:'amd_purchases',
  invoices:'amd_invoices', orders:'amd_orders', bookers:'amd_bookers', settings:'amd_settings'
};
function load(key, fallback){ try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; } }
function save(key, val){ localStorage.setItem(key, JSON.stringify(val)); }

let state = {
  products: load(DB.products, []),
  customers: load(DB.customers, []),
  purchases: load(DB.purchases, []),
  invoices: load(DB.invoices, []),
  orders: load(DB.orders, []),
  bookers: load(DB.bookers, []),
  settings: load(DB.settings, { invoiceSeq: 1, year: new Date().getFullYear() })
};

/* ============ CLOUD SYNC (Firestore) ============ */
let currentView = 'dashboard';
let cloudConnected = false;
const CLOUD_PARTS = ['products','customers','purchases','invoices','orders','bookers','settings'];

function setCloudStatus(status){
  const dot = document.getElementById('cloudDot');
  const label = document.getElementById('cloudLabel');
  if(!dot || !label) return;
  if(status==='connected'){ dot.style.background = 'var(--mint-500)'; label.textContent = 'Synced'; label.style.color = 'var(--mint-600)'; }
  else if(status==='error'){ dot.style.background = 'var(--red-500)'; label.textContent = 'Offline (local only)'; label.style.color = 'var(--red-700)'; }
  else { dot.style.background = 'var(--amber-500)'; label.textContent = 'Connecting...'; label.style.color = 'var(--amber-700)'; }
}

function persist(part){
  save(DB[part], state[part]); // always keep a local cache as a safety net
  if(!window.fbDB){ return; }
  try{
    const ref = window.fbDoc(window.fbDB, 'amd', part);
    const payload = part==='settings' ? state.settings : { list: state[part] };
    window.fbSetDoc(ref, payload).catch(err=>{ console.error('Cloud save failed:', part, err); setCloudStatus('error'); });
  }catch(e){ console.error(e); setCloudStatus('error'); }
}

function startCloudSync(){
  CLOUD_PARTS.forEach(part=>{
    const ref = window.fbDoc(window.fbDB, 'amd', part);
    window.fbOnSnapshot(ref, snap=>{
      cloudConnected = true;
      setCloudStatus('connected');
      if(snap.exists()){
        const data = snap.data();
        state[part] = part==='settings' ? data : (data.list || []);
        save(DB[part], state[part]);
        render(currentView);
      } else {
        // nothing in cloud yet for this part - push whatever we have locally (e.g. seed data)
        persist(part);
      }
    }, err=>{
      console.error('Sync error for', part, err);
      setCloudStatus('error');
    });
  });
}
window.startApp = function(){ startCloudSync(); };

function nextId(arr){ return arr.length ? Math.max(...arr.map(x=>x.id)) + 1 : 1; }

/* seed demo data on first run */
if(state.products.length===0 && state.customers.length===0 && localStorage.getItem('amd_seeded')!==  '1'){
  state.products = [
    {id:1,name:'Panadol',packing:'10S',batch:'BATCH-001',rate:150,stock:120},
    {id:2,name:'Augmentin 625',packing:'6S',batch:'BATCH-014',rate:420,stock:8},
    {id:3,name:'Brufen 400',packing:'20S',batch:'BATCH-022',rate:210,stock:60},
  ];
  state.customers = [
    {id:1,code:'CUST-001',name:'Ali Pharmacy',address:'Main Road, RYK',phone:'0300-1234567',balance:5000},
    {id:2,code:'CUST-002',name:'City Medical Store',address:'Airport Road, RYK',phone:'0301-9988776',balance:0},
  ];
  persist('products'); persist('customers');
  localStorage.setItem('amd_seeded','1');
}

/* ============ TOAST ============ */
function toast(msg, type='success'){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const icon = type==='success' ? 'fa-circle-check' : type==='error' ? 'fa-circle-xmark' : 'fa-triangle-exclamation';
  el.innerHTML = `<i class="fa-solid ${icon}"></i><span>${msg}</span>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 2600);
}

/* ============ AMOUNT IN WORDS (Indian/Pak numbering) ============ */
function numberToWords(num){
  num = Math.round(num);
  if(num===0) return 'Zero';
  const ones = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const tens = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function two(n){ if(n<20) return ones[n]; return tens[Math.floor(n/10)] + (n%10? ' '+ones[n%10]:''); }
  function three(n){ let s=''; if(n>=100){ s += ones[Math.floor(n/100)] + ' Hundred '; n%=100; } s += two(n); return s.trim(); }
  let str = '';
  const crore = Math.floor(num/10000000); num %= 10000000;
  const lakh = Math.floor(num/100000); num %= 100000;
  const thousand = Math.floor(num/1000); num %= 1000;
  const rest = num;
  if(crore) str += three(crore) + ' Crore ';
  if(lakh) str += three(lakh) + ' Lakh ';
  if(thousand) str += three(thousand) + ' Thousand ';
  if(rest) str += three(rest);
  return str.trim() + ' Only';
}

  openModal('New Purchase Order', body, foot, true);

function purchaseRow(it, idx){
  return `<tr>
    <td><select onchange="purchaseItems[${idx}].productId=parseInt(this.value); updatePurchaseCalc();">
      <option value="">-- select --</option>
      ${state.products.map(p=>`<option value="${p.id}" ${it.productId==p.id?'selected':''}>${p.name} (${p.packing})</option>`).join('')}
    </select></td>
    <td><input type="number" value="${it.qty}" oninput="purchaseItems[${idx}].qty=parseFloat(this.value)||0; updatePurchaseCalc();"></td>
    <td><input type="number" value="${it.rate}" oninput="purchaseItems[${idx}].rate=parseFloat(this.value)||0; updatePurchaseCalc();"></td>
    <td class="mono">${fmt(it.qty*it.rate)}</td>
    <td><button class="icon-btn" onclick="removePurchaseRow(${idx})"><i class="fa-solid fa-xmark"></i></button></td>
  </tr>`;
}
function addPurchaseRow(){ purchaseItems.push({productId:'',qty:1,rate:0}); renderPurchaseModal(); }
function removePurchaseRow(idx){ purchaseItems.splice(idx,1); if(purchaseItems.length===0) purchaseItems.push({productId:'',qty:1,rate:0}); renderPurchaseModal(); }
function purchaseTotal(){ return purchaseItems.reduce((s,it)=>s+(it.qty*it.rate),0); }
function updatePurchaseCalc(){
  document.getElementById('pu_items_body').innerHTML = purchaseItems.map((it,idx)=>purchaseRow(it,idx)).join('');
  document.getElementById('pu_total').textContent = fmt(purchaseTotal());
}
function savePurchase(){
  const supplier = document.getElementById('pu_supplier').value.trim();
  const date = document.getElementById('pu_date').value || todayStr();
  const items = purchaseItems.filter(it=>it.productId);
  if(!supplier){ toast('Supplier name required','error'); return; }
  if(items.length===0){ toast('Add at least one item','error'); return; }
  const finalItems = items.map(it=>({productId:it.productId, qty:it.qty, rate:it.rate, amount:it.qty*it.rate}));
  const total = finalItems.reduce((s,it)=>s+it.amount,0);
  state.purchases.push({id:nextId(state.purchases), supplier, date, items:finalItems, total});
  finalItems.forEach(it=>{ const p = state.products.find(x=>x.id===it.productId); if(p) p.stock += it.qty; });
  persist('purchases'); persist('products');
  closeModal(); render('purchases'); toast('Purchase saved & stock updated');
}

  const cust = state.customers.find(c=>c.id==invoiceCustomerId);
  const body = `
  <div class="form-row">
    <div class="field"><label>Invoice #</label><input value="${nextInvoiceNo()}" disabled></div>
    <div class="field"><label>Date</label><input id="iv_date" type="date" value="${todayStr()}"></div>
  </div>
  <div class="form-row">
    <div class="field"><label>Customer</label>
      <select id="iv_customer" onchange="invoiceCustomerId=this.value; renderInvoiceModal();">
        <option value="">-- select customer --</option>
        ${state.customers.map(c=>`<option value="${c.id}" ${c.id==invoiceCustomerId?'selected':''}>${c.code} - ${c.name}</option>`).join('')}
      </select>
    </div>
    <div class="field"><label>Address</label><input value="${cust?cust.address:''}" disabled></div>
  </div>

  <div class="table-wrap"><table class="inv-items"><thead><tr>
    <th>#</th><th style="width:22%">Description</th><th>Packing</th><th>Batch#</th><th>Qty</th><th>Bonus</th><th>T/Price</th><th>Disc%</th><th>Amount</th><th></th>
  </tr></thead><tbody id="iv_items_body">${invoiceItems.map((it,idx)=>invoiceRow(it,idx)).join('')}</tbody></table></div>
  <button class="btn btn-outline btn-sm" style="margin-top:10px;" onclick="addInvoiceRow()"><i class="fa-solid fa-plus"></i> Add Item</button>

  <div class="totals-box" id="iv_totals">${invoiceTotalsHtml()}</div>
  `;
  const foot = `<button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveInvoice()"><i class="fa-solid fa-check"></i> Save & Print Invoice</button>`;
  openModal('New Invoice', body, foot, true);
}
function invoiceRow(it, idx){
  const prod = state.products.find(p=>p.id==it.productId);
  const amount = calcLineAmount(it);
  return `<tr>
    <td>${idx+1}</td>
    <td><select onchange="onInvProductChange(${idx}, this.value)">
      <option value="">-- select --</option>
      ${state.products.map(p=>`<option value="${p.id}" ${it.productId==p.id?'selected':''}>${p.name}</option>`).join('')}
    </select></td>
    <td class="mono">${it.packing||'-'}</td>
    <td class="mono">${it.batch||'-'}</td>
    <td><input type="number" value="${it.qty}" oninput="invoiceItems[${idx}].qty=parseFloat(this.value)||0; updateInvoiceCalc();"></td>
    <td><input type="number" value="${it.bonus}" oninput="invoiceItems[${idx}].bonus=parseFloat(this.value)||0; updateInvoiceCalc();"></td>
    <td><input type="number" value="${it.rate}" oninput="invoiceItems[${idx}].rate=parseFloat(this.value)||0; updateInvoiceCalc();"></td>
    <td><input type="number" value="${it.disc}" oninput="invoiceItems[${idx}].disc=parseFloat(this.value)||0; updateInvoiceCalc();"></td>
    <td class="mono">${fmt(amount)}</td>
    <td><button class="icon-btn" onclick="removeInvoiceRow(${idx})"><i class="fa-solid fa-xmark"></i></button></td>
  </tr>`;
}
function onInvProductChange(idx, val){
  const p = state.products.find(x=>x.id==val);
  invoiceItems[idx].productId = val ? parseInt(val) : '';
  invoiceItems[idx].packing = p ? p.packing : '';
  invoiceItems[idx].batch = p ? p.batch : '';
  invoiceItems[idx].rate = p ? p.rate : 0;
  updateInvoiceCalc();
}
function calcLineAmount(it){
  const gross = it.qty * it.rate;
  const discAmt = gross * (it.disc/100);
  return gross - discAmt;
}
function addInvoiceRow(){ invoiceItems.push(emptyInvItem()); updateInvoiceCalc(true); }
function removeInvoiceRow(idx){ invoiceItems.splice(idx,1); if(invoiceItems.length===0) invoiceItems.push(emptyInvItem()); updateInvoiceCalc(true); }
function invoiceTotals(){
  let grand=0, disc=0;
  invoiceItems.forEach(it=>{ grand += it.qty*it.rate; disc += (it.qty*it.rate)*(it.disc/100); });
  const invoiceTotal = grand - disc;
  const cust = state.customers.find(c=>c.id==invoiceCustomerId);
  const prevBal = cust ? cust.balance : 0;
  const payable = invoiceTotal + prevBal;
  return {grand, disc, invoiceTotal, prevBal, payable};
}
function invoiceTotalsHtml(){
  const t = invoiceTotals();
  return `
  <div class="row"><span>Grand Total</span><span>${fmt(t.grand)}</span></div>
  <div class="row"><span>Total Discount</span><span>${fmt(t.disc)}</span></div>
  <div class="row"><span>Invoice Total</span><span>${fmt(t.invoiceTotal)}</span></div>
  <div class="row"><span>Previous Balance</span><span>${fmt(t.prevBal)}</span></div>
  <div class="row grand"><span>Total Payable</span><span>${fmt(t.payable)}</span></div>
  <div class="words-box">${numberToWords(t.payable)}</div>`;
}
function updateInvoiceCalc(fullRerender){
  if(fullRerender){ renderInvoiceModal(); return; }
  document.getElementById('iv_items_body').innerHTML = invoiceItems.map((it,idx)=>invoiceRow(it,idx)).join('');
  document.getElementById('iv_totals').innerHTML = invoiceTotalsHtml();
}
function saveInvoice(){
  if(!invoiceCustomerId){ toast('Please select a customer','error'); return; }
  const items = invoiceItems.filter(it=>it.productId);
  if(items.length===0){ toast('Add at least one item','error'); return; }
  const date = document.getElementById('iv_date').value || todayStr();
  const finalItems = items.map(it=>({productId:it.productId, packing:it.packing, batch:it.batch, qty:it.qty, bonus:it.bonus, rate:it.rate, disc:it.disc, amount:calcLineAmount(it)}));
  const t = invoiceTotals();
  const invoiceNo = nextInvoiceNo();
  const invoice = {
    id:nextId(state.invoices), invoiceNo, customerId:parseInt(invoiceCustomerId), date, items:finalItems,
    grandTotal:t.grand, totalDiscount:t.disc, invoiceTotal:t.invoiceTotal, previousBalance:t.prevBal,
    totalPayable:t.payable, amountInWords:numberToWords(t.payable)
  };
  state.invoices.push(invoice);
  // stock deduction
  finalItems.forEach(it=>{ const p = state.products.find(x=>x.id===it.productId); if(p) p.stock -= (it.qty + (it.bonus||0)); });
  // customer balance update
  const cust = state.customers.find(c=>c.id===invoice.customerId);
  if(cust) cust.balance = t.payable;
  state.settings.invoiceSeq += 1;
  persist('invoices'); persist('products'); persist('customers'); persist('settings');
  closeModal(); render('invoices');
  toast('Invoice ' + invoiceNo + ' saved');
  printInvoice(invoice.id);
}

    document.getElementById('gpsResult').innerHTML = `<span class="gps-chip"><i class="fa-solid fa-location-dot"></i> ${bookerGps.lat.toFixed(4)}, ${bookerGps.lng.toFixed(4)}</span>`;

  });

function viewReports(){

  </div>
  <div id="reportBody"></div>
  `;
}
function wireReportsDefault(){ reportTab('sales'); }
function reportTab(type){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  const idx = ['sales','purchases','balance','lowstock','pending'].indexOf(type);
  document.querySelectorAll('.tab-btn')[idx].classList.add('active');
  const el = document.getElementById('reportBody');
  if(type==='sales') el.innerHTML = reportDateRange('sales');
  else if(type==='purchases') el.innerHTML = reportDateRange('purchases');
  else if(type==='balance') el.innerHTML = reportBalance();
  else if(type==='lowstock') el.innerHTML = reportLowStock();
  else if(type==='pending') el.innerHTML = reportPending();
}
function reportDateRange(type){
  return `
  <div class="panel"><div class="panel-body">
    <div class="form-row" style="align-items:flex-end;">
      <div class="field"><label>From</label><input type="date" id="rep_from"></div>
      <div class="field"><label>To</label><input type="date" id="rep_to"></div>
      <div class="field"><button class="btn btn-primary" onclick="runReport('${type}')">Generate</button></div>
    </div>
    <div id="rep_result"></div>
  </div></div>`;
}
function runReport(type){
  const from = document.getElementById('rep_from').value;
  const to = document.getElementById('rep_to').value;
  const inRange = d => (!from || d>=from) && (!to || d<=to);
  let html = '';
  if(type==='sales'){
    const rows = state.invoices.filter(i=>inRange(i.date));
    const total = rows.reduce((s,i)=>s+i.invoiceTotal,0);
    html = `<p style="margin:14px 0 8px; font-weight:700;">Total Sales: ${fmt(total)} (${rows.length} invoices)</p>
    <div class="table-wrap"><table><thead><tr><th>Invoice#</th><th>Customer</th><th>Date</th><th>Total</th></tr></thead><tbody>
    ${rows.map(i=>{ const c=state.customers.find(x=>x.id===i.customerId); return `<tr><td class="mono">${i.invoiceNo}</td><td>${c?c.name:'-'}</td><td>${i.date}</td><td>${fmt(i.invoiceTotal)}</td></tr>`;}).join('') || `<tr class="empty-row"><td colspan="4">No records found</td></tr>`}
    </tbody></table></div>`;
  } else {
    const rows = state.purchases.filter(p=>inRange(p.date));
    const total = rows.reduce((s,p)=>s+p.total,0);
    html = `<p style="margin:14px 0 8px; font-weight:700;">Total Purchases: ${fmt(total)} (${rows.length} orders)</p>
    <div class="table-wrap"><table><thead><tr><th>PO#</th><th>Supplier</th><th>Date</th><th>Total</th></tr></thead><tbody>
    ${rows.map(p=>`<tr><td class="mono">PO-${String(p.id).padStart(4,'0')}</td><td>${p.supplier}</td><td>${p.date}</td><td>${fmt(p.total)}</td></tr>`).join('') || `<tr class="empty-row"><td colspan="4">No records found</td></tr>`}
    </tbody></table></div>`;
  }
  document.getElementById('rep_result').innerHTML = html;
}
function reportBalance(){
  const total = state.customers.reduce((s,c)=>s+c.balance,0);
  return `<div class="panel"><div class="panel-body">
  <p style="margin-bottom:10px; font-weight:700;">Total Outstanding: ${fmt(total)}</p>
  <div class="table-wrap"><table><thead><tr><th>Code</th><th>Name</th><th>Phone</th><th>Balance</th></tr></thead><tbody>
  ${state.customers.map(c=>`<tr><td class="mono">${c.code}</td><td>${c.name}</td><td>${c.phone||'-'}</td><td>${fmt(c.balance)}</td></tr>`).join('') || `<tr class="empty-row"><td colspan="4">No customers</td></tr>`}
  </tbody></table></div></div></div>`;
}
function reportLowStock(){
  const rows = state.products.filter(p=>p.stock<10);
  return `<div class="panel"><div class="panel-body">
  <div class="table-wrap"><table><thead><tr><th>Product</th><th>Packing</th><th>Batch#</th><th>Stock</th></tr></thead><tbody>
  ${rows.map(p=>`<tr><td>${p.name}</td><td>${p.packing}</td><td class="mono">${p.batch}</td><td><span class="badge low">${p.stock}</span></td></tr>`).join('') || `<tr class="empty-row"><td colspan="4">All stocked well</td></tr>`}
  </tbody></table></div></div></div>`;
}
function reportPending(){
  const rows = state.orders.filter(o=>o.status==='Pending');
  return `<div class="panel"><div class="panel-body">
  <div class="table-wrap"><table><thead><tr><th>ID</th><th>Booker</th><th>Customer</th><th>Date</th></tr></thead><tbody>
  ${rows.map(o=>{ const c=state.customers.find(x=>x.id===o.customerId); return `<tr><td class="mono">ORD-${String(o.id).padStart(4,'0')}</td><td>${o.bookerName}</td><td>${c?c.name:'-'}</td><td>${o.date}</td></tr>`;}).join('') || `<tr class="empty-row"><td colspan="4">No pending orders</td></tr>`}
  </tbody></table></div></div></div>`;
}

/* ===================================================================
   BACKUP / RESTORE
=================================================================== */
function viewBackup(){
  return `
  <div class="panel">
    <div class="panel-head"><h3>Export Data</h3></div>
    <div class="panel-body">
      <p style="color:var(--text-muted); margin-bottom:14px;">Download a full backup of products, customers, purchases, invoices and orders as a JSON file.</p>
      <button class="btn btn-primary" onclick="exportData()"><i class="fa-solid fa-download"></i> Download Backup (JSON)</button>
    </div>
  </div>
  <div class="panel">
    <div class="panel-head"><h3>Import Data</h3></div>
    <div class="panel-body">
      <p style="color:var(--text-muted); margin-bottom:14px;">Restoring a backup will replace all current data in this browser.</p>
      <input type="file" id="importFile" accept=".json" style="margin-bottom:12px;">
      <br><button class="btn btn-outline" onclick="importData()"><i class="fa-solid fa-upload"></i> Restore From File</button>
    </div>
  </div>`;
}
function exportData(){
  const backup = { products:state.products, customers:state.customers, purchases:state.purchases, invoices:state.invoices, orders:state.orders, bookers:state.bookers, settings:state.settings, exportedAt:new Date().toISOString() };
  const blob = new Blob([JSON.stringify(backup,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'al-maida-backup-' + todayStr() + '.json';
  a.click(); URL.revokeObjectURL(url);
  toast('Backup downloaded');
}
function importData(){
  const file = document.getElementById('importFile').files[0];
  if(!file){ toast('Choose a backup file first','error'); return; }
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const data = JSON.parse(e.target.result);
      state.products = data.products||[]; state.customers = data.customers||[]; state.purchases = data.purchases||[];
      state.invoices = data.invoices||[]; state.orders = data.orders||[]; state.bookers = data.bookers||[];
      state.settings = data.settings||{invoiceSeq:1,year:new Date().getFullYear()};
      ['products','customers','purchases','invoices','orders','bookers','settings'].forEach(persist);
      toast('Data restored successfully'); render('backup');
    }catch(err){ toast('Invalid backup file','error'); }
  };
  reader.readAsText(file);
}

/* ============ VIEW WIRING (search inputs etc.) ============ */
function wireView(view){
  if(view==='products'){
    const s = document.getElementById('prodSearch');
    if(s) s.addEventListener('input', e=>{ productSearch = e.target.value; render('products'); document.getElementById('prodSearch').focus(); document.getElementById('prodSearch').selectionStart = document.getElementById('prodSearch').value.length; });
  }
  if(view==='customers'){
    const s = document.getElementById('custSearch');
    if(s) s.addEventListener('input', e=>{ customerSearch = e.target.value; render('customers'); document.getElementById('custSearch').focus(); document.getElementById('custSearch').selectionStart = document.getElementById('custSearch').value.length; });
  }
  if(view==='reports'){ wireReportsDefault(); }
}

/* ============ INIT ============ */
render('dashboard');
</script>
